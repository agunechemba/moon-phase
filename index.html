<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Phase Viewer</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono&display=swap');

        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header & Date Picker --- */
        .header {
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            gap: 15px;
            padding-top: env(safe-area-inset-top, 20px); /* PWA notch support */
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Custom Date Picker */
        .date-picker-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            align-self: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .date-picker-wrapper:hover {
            background: #222;
        }

        input[type="date"] {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.7;
        }

        /* --- Timeline --- */
        .timeline-wrapper {
            position: relative;
            height: 120px;
            margin-top: 10px;
            width: 100%;
            transform: rotate(-4deg) translateY(-20px);
        }

        .timeline-track {
            position: absolute;
            top: 50px;
            left: -10%;
            width: 120%;
            height: 60px;
            border-top: 2px solid #222;
            border-radius: 50% 50% 0 0;
            background: transparent;
        }

        .timeline-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 calc(50% - 20px);
            height: 100%;
            align-items: center;
            cursor: grab;
            position: relative;
            z-index: 2;
        }

        .timeline-scroll::-webkit-scrollbar {
            display: none;
        }

        .day-item {
            flex: 0 0 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            position: relative;
            transition: color 0.3s;
        }

        .day-item.active {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .day-item .dot {
            width: 6px;
            height: 6px;
            background-color: #444;
            border-radius: 50%;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .day-item.active .dot {
            background-color: white;
            transform: scale(1.5);
        }

        .month-label {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(4deg);
            font-family: 'Space Mono', monospace;
            letter-spacing: 4px;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        /* --- Main Moon Display --- */
        .main-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            margin-top: -40px;
        }

        .moon-container {
            width: 260px;
            height: 260px;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #666, #222 60%, #111);
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 50px rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .moon-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 70% 40%, rgba(0,0,0,0.4) 10%, transparent 15%),
                radial-gradient(circle at 40% 70%, rgba(0,0,0,0.5) 15%, transparent 20%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 5%, transparent 10%),
                radial-gradient(circle at 20% 50%, rgba(0,0,0,0.3) 8%, transparent 12%),
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.05) 8%, transparent 12%);
            border-radius: 50%;
            mix-blend-mode: overlay;
            z-index: 1;
        }

        .moon-shadow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            border-radius: 50%;
            background-color: var(--bg-color);
            transition: transform 0.1s linear;
            z-index: 2;
        }

        .date-info {
            text-align: center;
            margin-top: 40px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .date-text {
            font-family: 'Space Mono', monospace;
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .sub-text {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: #777;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-top">
            <h1>Moon Phases</h1>
        </div>
        <div class="date-picker-wrapper" title="Jump to any date">
            <input type="date" id="datePicker">
        </div>
    </div>

    <div class="timeline-wrapper">
        <div class="timeline-track"></div>
        <div class="month-label" id="monthLabel">MONTH</div>
        <div class="timeline-scroll" id="timelineScroll"></div>
    </div>

    <div class="main-display">
        <div class="moon-container">
            <div class="moon-shadow" id="moonShadow"></div>
        </div>
        <div class="date-info">
            <div class="date-text" id="dateText">LOADING...</div>
            <div class="sub-text" id="subText"></div>
        </div>
    </div>
</div>

<script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('SW Registered'))
                .catch(err => console.log('SW Registration Failed: ', err));
        });
    }

    // --- Moon App Logic ---
    const TIMELINE_RANGE = 15; 
    const SCROLL_CONTAINER = document.getElementById('timelineScroll');
    const MOON_SHADOW = document.getElementById('moonShadow');
    const DATE_TEXT = document.getElementById('dateText');
    const SUB_TEXT = document.getElementById('subText');
    const MONTH_LABEL = document.getElementById('monthLabel');
    const DATE_PICKER = document.getElementById('datePicker');

    const MONTHS = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

    function formatDateInput(date) {
        let d = new Date(date),
            month = '' + (d.getMonth() + 1),
            day = '' + d.getDate(),
            year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }

    function generateTimeline(centerDate) {
        SCROLL_CONTAINER.innerHTML = ''; 
        let baseDate = new Date(centerDate);
        
        for (let i = -TIMELINE_RANGE; i <= TIMELINE_RANGE; i++) {
            let currentDate = new Date(baseDate);
            currentDate.setDate(baseDate.getDate() + i);
            let dayStr = currentDate.getDate().toString().padStart(2, '0');
            
            let dayDiv = document.createElement('div');
            dayDiv.className = 'day-item';
            dayDiv.dataset.index = i;
            dayDiv.dataset.date = currentDate.toISOString();
            dayDiv.innerHTML = `${dayStr}<div class="dot"></div>`;
            SCROLL_CONTAINER.appendChild(dayDiv);
        }
    }

    function getMoonPhase(date) {
        const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
        const lunarCycle = 29.530588853;
        const msInDay = 86400000;
        
        let daysSince = (date.getTime() - knownNewMoon) / msInDay;
        let phase = (daysSince % lunarCycle) / lunarCycle;
        return phase < 0 ? phase + 1 : phase;
    }

    function updateMoon(date) {
        const phase = getMoonPhase(date);
        const illumination = Math.round(((1 - Math.cos(2 * Math.PI * phase)) / 2) * 100);

        const month = MONTHS[date.getMonth()];
        const day = date.getDate().toString().padStart(2, '0');
        const year = date.getFullYear();
        
        DATE_TEXT.innerText = `${month} ${day}, ${year}`;
        MONTH_LABEL.innerText = month;

        if (illumination < 2) {
            SUB_TEXT.innerText = `New Moon`;
        } else if (illumination > 98) {
            SUB_TEXT.innerText = `Full Moon - ${illumination}% illuminated`;
        } else {
            SUB_TEXT.innerText = `${illumination}% illuminated`;
        }

        if (phase < 0.5) {
            let translateX = (phase * 2) * 100; 
            MOON_SHADOW.style.transform = `translateX(${translateX}%)`;
        } else {
            let p = (phase - 0.5) * 2;
            let translateX = 100 - (p * 100);
            MOON_SHADOW.style.transform = `translateX(${translateX}%)`;
        }
    }

    let scrollTimeout;
    SCROLL_CONTAINER.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const items = document.querySelectorAll('.day-item');
            const containerCenter = SCROLL_CONTAINER.scrollLeft + (SCROLL_CONTAINER.clientWidth / 2);
            
            let closestIndex = 0;
            let minDistance = Infinity;

            items.forEach((item, index) => {
                const itemCenter = item.offsetLeft + (item.clientWidth / 2);
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });

            if (items[closestIndex]) {
                items.forEach(item => item.classList.remove('active'));
                items[closestIndex].classList.add('active');

                let activeDate = new Date(items[closestIndex].dataset.date);
                updateMoon(activeDate);
                DATE_PICKER.value = formatDateInput(activeDate);
            }
        }, 50); 
    });

    DATE_PICKER.addEventListener('change', (e) => {
        if (!e.target.value) return;
        const [year, month, day] = e.target.value.split('-');
        const selectedDate = new Date(year, month - 1, day);
        jumpToDate(selectedDate);
    });

    function jumpToDate(targetDate) {
        generateTimeline(targetDate);
        setTimeout(() => {
            const items = document.querySelectorAll('.day-item');
            const centerItem = items[TIMELINE_RANGE];
            if (centerItem) {
                SCROLL_CONTAINER.scrollTo({
                    left: centerItem.offsetLeft - (SCROLL_CONTAINER.clientWidth / 2) + (centerItem.clientWidth / 2),
                    behavior: 'instant'
                });
                SCROLL_CONTAINER.dispatchEvent(new Event('scroll'));
            }
        }, 10);
    }

    window.onload = () => {
        jumpToDate(new Date());
    };
</script>
</body>
</html>
